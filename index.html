<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SleepSync</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css"></head><body>
<div id="auth"><div class="card"><div class="moon">🌙</div><h1>SleepSync</h1><p class="mut">Track sleep, keep a schedule, wake up on time.</p>
<div id="af"></div><div class="row" style="margin-top:14px"><button class="btn" id="go">Get started</button><button class="btn ghost" id="demo">Try demo</button></div>
<p class="mut" style="margin-top:12px">No account needed. Your data is stored only in this browser (LocalStorage).</p></div></div>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="ring"><div class="card" style="text-align:center"><div class="moon">⏰</div><h1 id="rl">Wake up</h1><div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="snz">Snooze 5 min</button><button class="btn ghost" id="dis">Dismiss</button></div></div></div>
<div id="toast"></div>
<script src="script.js"></script></body></html>
